<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Selected CDC developmental checkpoints from 12 to 24 months</title>
  <desc id="desc">Four age checkpoints with selected communication, play, movement, and hand-skill examples. This is not a diagnostic test.</desc>
  <rect width="1200" height="720" fill="#f7f4ed"/>
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#20342e">Developmental checkpoints: 12–24 months</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20" fill="#50635c">Selected CDC examples · observe in everyday life · ask early when concerned</text>
  <line x1="130" y1="190" x2="1070" y2="190" stroke="#6c857c" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60,150)">
      <circle cx="100" cy="40" r="36" fill="#2b6f63"/><text x="100" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">12</text>
      <text x="100" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#20342e">12 months</text>
      <rect x="0" y="130" width="230" height="330" rx="18" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
      <text x="22" y="172" font-size="21" font-weight="700" fill="#2b6f63">Connect</text>
      <text x="22" y="204" font-size="18" fill="#263a34">• Plays a social game</text>
      <text x="22" y="234" font-size="18" fill="#263a34">• Waves bye-bye</text>
      <text x="22" y="282" font-size="21" font-weight="700" fill="#2b6f63">Explore</text>
      <text x="22" y="314" font-size="18" fill="#263a34">• Puts an object in</text><text x="39" y="338" font-size="18" fill="#263a34">a container</text>
      <text x="22" y="386" font-size="21" font-weight="700" fill="#2b6f63">Move</text>
      <text x="22" y="418" font-size="18" fill="#263a34">• Pulls to stand</text>
      <text x="22" y="448" font-size="18" fill="#263a34">• Cruises holding on</text>
    </g>
    <g transform="translate(345,150)">
      <circle cx="100" cy="40" r="36" fill="#3f7f9a"/><text x="100" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">15</text>
      <text x="100" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#20342e">15 months</text>
      <rect x="0" y="130" width="230" height="330" rx="18" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
      <text x="22" y="172" font-size="21" font-weight="700" fill="#3f7f9a">Communicate</text>
      <text x="22" y="204" font-size="18" fill="#263a34">• Tries 1–2 words</text><text x="39" y="228" font-size="16" fill="#50635c">beyond parent names</text>
      <text x="22" y="258" font-size="18" fill="#263a34">• Points for help</text>
      <text x="22" y="306" font-size="21" font-weight="700" fill="#3f7f9a">Build &amp; move</text>
      <text x="22" y="338" font-size="18" fill="#263a34">• Stacks 2 objects</text>
      <text x="22" y="368" font-size="18" fill="#263a34">• Takes a few steps</text>
    </g>
    <g transform="translate(630,150)">
      <circle cx="100" cy="40" r="36" fill="#9a6b3f"/><text x="100" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">18</text>
      <text x="100" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#20342e">18 months</text>
      <rect x="0" y="130" width="230" height="330" rx="18" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
      <text x="22" y="172" font-size="21" font-weight="700" fill="#9a6b3f">Communicate</text>
      <text x="22" y="204" font-size="18" fill="#263a34">• Tries 3+ words</text><text x="39" y="228" font-size="16" fill="#50635c">beyond parent names</text>
      <text x="22" y="258" font-size="18" fill="#263a34">• Follows 1-step</text><text x="39" y="282" font-size="18" fill="#263a34">direction</text>
      <text x="22" y="330" font-size="21" font-weight="700" fill="#9a6b3f">Hands &amp; body</text>
      <text x="22" y="362" font-size="18" fill="#263a34">• Scribbles</text>
      <text x="22" y="392" font-size="18" fill="#263a34">• Walks independently</text>
      <text x="22" y="422" font-size="18" fill="#263a34">• Tries a spoon</text>
    </g>
    <g transform="translate(915,150)">
      <circle cx="100" cy="40" r="36" fill="#7a557d"/><text x="100" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="white">24</text>
      <text x="100" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#20342e">24 months</text>
      <rect x="0" y="130" width="230" height="330" rx="18" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
      <text x="22" y="172" font-size="21" font-weight="700" fill="#7a557d">Communicate</text>
      <text x="22" y="204" font-size="18" fill="#263a34">• Combines 2 words</text>
      <text x="22" y="234" font-size="18" fill="#263a34">• Points in a book</text>
      <text x="22" y="282" font-size="21" font-weight="700" fill="#7a557d">Move &amp; solve</text>
      <text x="22" y="314" font-size="18" fill="#263a34">• Runs</text>
      <text x="22" y="344" font-size="18" fill="#263a34">• Kicks a ball</text>
      <text x="22" y="374" font-size="18" fill="#263a34">• Eats with a spoon</text>
      <text x="22" y="404" font-size="18" fill="#263a34">• Uses 2 toys together</text>
    </g>
  </g>
  <rect x="60" y="640" width="1080" height="48" rx="12" fill="#e4ece8"/>
  <text x="600" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">Selected examples only · CDC checklists are not diagnostic tests · skill loss or concerns: contact a clinician</text>
</svg>
