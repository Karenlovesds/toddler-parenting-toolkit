<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">12 months — Connect, contain, and move: selected CDC examples</title>
  <desc id="desc">A wide cup holding one large block, with another block and a rolling ball beside it. Connecting, putting an object in a container, and moving are selected 1-year examples, not a diagnostic test.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#2b6f63"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">12</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Connect, contain, and move</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">CDC 1-year checklist · WHO responsive care · AAP play guidance — selected examples</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2b6f63">Drop in, take out, let them try</text>
  <rect x="414" y="178" width="246" height="34" rx="17" fill="#e4ece8" stroke="#9fb3aa" stroke-width="2"/>
  <text x="537" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#20342e">CDC 1-year checkpoint</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <rect x="270" y="330" width="130" height="150" rx="16" fill="#bfd8ea" stroke="#3f7f9a" stroke-width="5"/>
  <rect x="290" y="262" width="90" height="90" rx="12" fill="#2b6f63"/>
  <rect x="305" y="277" width="60" height="60" rx="10" fill="#2b6f63" stroke="#f7f4ed" stroke-width="3"/>
  <rect x="440" y="452" width="70" height="70" rx="12" fill="#9a6b3f"/>
  <circle cx="536" cy="502" r="34" fill="#7a557d"/>
  <path d="M515 496 A20 20 0 0 1 557 496" fill="none" stroke="#f0e3ef" stroke-width="3"/>
  <path d="M452 448 C408 396 388 342 352 306" fill="none" stroke="#50635c" stroke-width="4" stroke-linecap="round"/>
  <polygon points="352,306 364,305 356,293" fill="#50635c"/>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Put one large block in the wide cup, take it out, and let them try. Repetition is useful and welcome.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#dce9e5"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#2b6f63"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Drop in, take out</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Cause and effect, repeated freely</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#dce9e5"/>
    <circle cx="764" cy="328" r="19" fill="#2b6f63"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Crawl, cruise, walk</text>
    <text x="816" y="352" font-size="16" fill="#50635c">Use current ability; do not force a skill</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#dce9e5"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#2b6f63"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Point, name, and pause</text>
    <text x="816" y="464" font-size="16" fill="#50635c">Respond to looks, sounds, and gestures</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#dce9e5"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#2b6f63"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">Respond and reconnect</text>
    <text x="816" y="576" font-size="16" fill="#50635c">After separation, offer a favorite activity</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">Selected examples from the CDC 1-year checklist plus WHO responsive care and AAP play — not a diagnostic test.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">Skill loss or any concern: talk with a clinician and use the full official checklists.</text>
</svg>