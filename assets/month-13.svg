<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">13 months — Repeat and discover</title>
  <desc id="desc">A container being tipped out with blocks spilling from it and a looped arrow showing repetition. Repeating a familiar drop-and-tip action without turning play into a test.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#3f7f9a"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">13</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Repeat and discover</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">WHO responsive care · AAP play guidance — selected examples, practical adaptation</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3f7f9a">Tip it out, and try again</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <path d="M300 300 L300 180 Q300 150 330 150 Q360 150 360 180 L360 300 Z" fill="none" stroke="#3f7f9a" stroke-width="5"/>
  <rect x="300" y="330" width="120" height="120" rx="14" fill="#bfd8ea" stroke="#3f7f9a" stroke-width="5"/>
  <rect x="318" y="438" width="42" height="42" rx="8" fill="#2b6f63"/>
  <rect x="360" y="418" width="42" height="42" rx="8" fill="#9a6b3f"/>
  <rect x="440" y="430" width="52" height="52" rx="10" fill="#7a557d"/>
  <circle cx="520" cy="480" r="30" fill="#2b6f63"/>
  <path d="M330 170 C290 210 285 240 300 280" fill="none" stroke="#b85f4e" stroke-width="4" stroke-linecap="round"/>
  <polygon points="300,280 292,271 288,284" fill="#b85f4e"/>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Drop, tip out, and repeat. Let the child explore cause and effect without turning play into a test.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#dbe7ee"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#3f7f9a"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Repeat and discover</text>
    <text x="816" y="240" font-size="16" fill="#50635c">The same action, gently changing</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#dbe7ee"/>
    <circle cx="764" cy="328" r="19" fill="#3f7f9a"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Roll a soft ball</text>
    <text x="816" y="352" font-size="16" fill="#50635c">Move between safe, stable surfaces</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#dbe7ee"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#3f7f9a"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Reread a favorite page</text>
    <text x="816" y="464" font-size="16" fill="#50635c">Name what catches their attention</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#dbe7ee"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#3f7f9a"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">Two safe choices</text>
    <text x="816" y="576" font-size="16" fill="#50635c">Accept a look or reach as an answer</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">WHO responsive care and AAP play guidance support this broad approach. This month is a practical adaptation, not a checklist.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">For monitoring, use the CDC 12- and 15-month checkpoints; raise concerns whenever they arise.</text>
</svg>