<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">14 months — Communicate and explore</title>
  <desc id="desc">An open cup with a ball inside, a box that opens or closes, and a speech bubble reading You can show me. Gestures, sounds, actions, signs, and words all count as communication.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#9a6b3f"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">14</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Communicate and explore</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">WHO responsive care · AAP play guidance — selected examples, practical adaptation</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a6b3f">In, out, open, closed</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <rect x="230" y="350" width="100" height="150" rx="14" fill="#efe3d4" stroke="#9a6b3f" stroke-width="5"/>
  <circle cx="280" cy="330" r="26" fill="#3f7f9a"/>
  <rect x="390" y="320" width="130" height="150" rx="14" fill="#e6d9c6" stroke="#9a6b3f" stroke-width="5"/>
  <rect x="382" y="296" width="146" height="30" rx="10" fill="#c9a06a" stroke="#9a6b3f" stroke-width="4"/>
  <text x="280" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">in · out</text>
  <text x="455" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">open · closed</text>
  <path d="M540 300 C600 300 620 280 620 250 L620 250 C620 268 634 282 654 282 C600 282 590 262 590 262 C590 262 585 250 575 250 C575 250 575 300 540 300 Z" fill="#f7e8c9"/>
  <text x="581" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8c6a2f">You can show me</text>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Treat every look, gesture, sound, sign, or word as meaningful communication, and add simple language.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#efe3d4"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#9a6b3f"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">In, out, open, closed</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Explore with large safe containers</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#efe3d4"/>
    <circle cx="764" cy="328" r="19" fill="#9a6b3f"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Carry or push</text>
    <text x="816" y="352" font-size="16" fill="#50635c">A large safe object along a clear path</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#efe3d4"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#9a6b3f"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Mean every cue</text>
    <text x="816" y="464" font-size="16" fill="#50635c">Respond to any gesture, sound, or word</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#efe3d4"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#9a6b3f"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">"You can show me"</text>
    <text x="816" y="576" font-size="16" fill="#50635c">Allow time for the child to respond</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">WHO responsive care and AAP play guidance support this broad approach. This month is a practical adaptation, not a checklist.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">For monitoring, use the CDC 12- and 15-month checkpoints; raise concerns whenever they arise.</text>
</svg>