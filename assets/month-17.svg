<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">17 months — Try it with a little help</title>
  <desc id="desc">Two large containers nesting, with a steadying hand above them. Offering a small amount of help without taking over lets the child stay involved in a manageable challenge.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#b85f4e"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">17</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Try it with a little help</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">WHO responsive care · AAP play guidance — selected examples, practical adaptation</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b85f4e">Nest two large containers</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <rect x="300" y="360" width="180" height="120" rx="18" fill="#f3d9c6" stroke="#b85f4e" stroke-width="5"/>
  <rect x="290" y="330" width="180" height="120" rx="18" fill="#f7e4d3" stroke="#b85f4e" stroke-width="5"/>
  <rect x="368" y="352" width="44" height="44" rx="8" fill="#b85f4e"/>
  <path d="M368 220 C368 180 388 165 418 165 C448 165 468 180 468 220" fill="none" stroke="#e7b3a4" stroke-width="7" stroke-linecap="round"/>
  <circle cx="418" cy="222" r="16" fill="none" stroke="#b85f4e" stroke-width="4"/>
  <text x="418" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">steady the lower one</text>
  <path d="M330 330 L330 300 C330 285 340 278 355 278 C370 278 380 285 380 300 L397 300 C397 285 407 278 422 278 C437 278 447 285 447 300 L447 330" fill="none" stroke="#d9a48f" stroke-width="4"/>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Pause before helping. Offer a small amount of help, and help promptly if they ask or seem distressed.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#f3e0dc"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#b85f4e"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Nest two containers</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Hold the lower one steady if needed</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#f3e0dc"/>
    <circle cx="764" cy="328" r="19" fill="#b85f4e"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Carry a soft toy</text>
    <text x="816" y="352" font-size="16" fill="#50635c">To a low basket on a clear floor</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#f3e0dc"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#b85f4e"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Pause at a picture</text>
    <text x="816" y="464" font-size="16" fill="#50635c">Room for the child to point or sound</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#f3e0dc"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#b85f4e"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">"Want me to hold it?"</text>
    <text x="816" y="576" font-size="16" fill="#50635c">Small help, without taking over</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">WHO responsive care and AAP play guidance support this broad approach. This month is a practical adaptation, not a checklist.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">For monitoring, use the CDC 15, 18, and 24-month checkpoints; raise concerns whenever they arise.</text>
</svg>