<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">18 months — Share attention and small choices</title>
  <desc id="desc">A crayon making marks, a cause-and-effect button toy, and a ball. Sharing attention and offering two simple real choices are the month's focus; selected 18-month milestone examples include scribbling, walking, and trying a spoon.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#2b6f63"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">18</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Share attention and choices</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">CDC 18-month checklist · WHO responsive care · AAP play guidance — selected examples</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2b6f63">"This one or this one?"</text>
  <rect x="414" y="178" width="246" height="34" rx="17" fill="#e4ece8" stroke="#9fb3aa" stroke-width="2"/>
  <text x="537" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#20342e">CDC 18-month checkpoint</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <rect x="110" y="430" width="70" height="70" rx="12" fill="#9a6b3f"/>
  <path d="M150 455 C180 455 190 448 196 435 L198 435" fill="none" stroke="#d9c9a0" stroke-width="8" stroke-linecap="round"/>
  <text x="145" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">scribbles</text>
  <circle cx="310" cy="448" r="42" fill="#bfd8ea" stroke="#3f7f9a" stroke-width="5"/>
  <rect x="292" y="412" width="36" height="20" rx="6" fill="#3f7f9a"/>
  <circle cx="310" cy="424" r="6" fill="#f7f4ed"/>
  <text x="310" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">cause-and-effect toy</text>
  <circle cx="500" cy="462" r="34" fill="#7a557d"/>
  <path d="M478 456 A22 22 0 0 1 522 456" fill="none" stroke="#f0e3ef" stroke-width="3"/>
  <text x="500" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">roll a ball</text>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Follow their marks instead of teaching a correct grip or shape. Keep the choices simple and real.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#dce9e5"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#2b6f63"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Cause-and-effect toy</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Take turns operating a safe button</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#dce9e5"/>
    <circle cx="764" cy="328" r="19" fill="#2b6f63"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Roll a ball back and forth</text>
    <text x="816" y="352" font-size="16" fill="#50635c">Offer a short route to carry it too</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#dce9e5"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#2b6f63"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Short book together</text>
    <text x="816" y="464" font-size="16" fill="#50635c">Let them pick which pages to revisit</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#dce9e5"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#2b6f63"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">Simple, real choices</text>
    <text x="816" y="576" font-size="16" fill="#50635c">"You can choose this one or this one"</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">Selected examples from the CDC 18-month checklist plus WHO responsive care and AAP play — not a diagnostic test.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">Skill loss or any concern: talk with a clinician and use the full official checklists.</text>
</svg>