<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">19 months — Everyday pretend play</title>
  <desc id="desc">A doll and a large safe pretend cup beside a block home for a toy animal. Offering a familiar scene and welcoming the child's own version is pretend play at this age.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#3f7f9a"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">19</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Everyday pretend play</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">WHO responsive care · AAP play guidance — selected examples, practical adaptation</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3f7f9a">Offer a familiar scene</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <circle cx="190" cy="390" r="52" fill="#f3e0dc"/>
  <circle cx="165" cy="372" r="18" fill="#f3e0dc"/>
  <circle cx="215" cy="372" r="18" fill="#f3e0dc"/>
  <rect x="150" y="425" width="80" height="70" rx="16" fill="#7a557d"/>
  <rect x="178" y="330" width="22" height="14" rx="5" fill="#b85f4e"/>
  <text x="190" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">doll</text>
  <path d="M330 470 L360 380 L390 470 Z" fill="#bfd8ea"/>
  <text x="360" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">pretend cup</text>
  <rect x="440" y="380" width="80" height="80" rx="12" fill="#9a6b3f"/>
  <rect x="500" y="330" width="70" height="70" rx="12" fill="#4d8a5f"/>
  <path d="M440 510 L520 510 L515 470 L445 470 Z" fill="#2b6f63"/>
  <circle cx="480" cy="452" r="10" fill="#b85f4e"/>
  <text x="480" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">a place for the animal</text>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Welcome their own version rather than correcting the pretend story. Make a place and let them rearrange it.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#dbe7ee"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#3f7f9a"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Blocks as a place</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Let them rearrange or dismantle it</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#dbe7ee"/>
    <circle cx="764" cy="328" r="19" fill="#3f7f9a"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Floor-level route</text>
    <text x="816" y="352" font-size="16" fill="#50635c">Between two baskets, no raised surface</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#dbe7ee"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#3f7f9a"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Story, then doll play</text>
    <text x="816" y="464" font-size="16" fill="#50635c">A large safe pretend cup, supervised</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#dbe7ee"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#3f7f9a"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">"Your bear can sit here"</text>
    <text x="816" y="576" font-size="16" fill="#50635c">Welcome their version of the story</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">WHO responsive care and AAP play guidance support this broad approach. This month is a practical adaptation, not a checklist.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">For monitoring, use the CDC 15, 18, and 24-month checkpoints; raise concerns whenever they arise.</text>
</svg>