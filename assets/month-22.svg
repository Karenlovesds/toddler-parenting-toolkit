<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">22 months — Make a small plan</title>
  <desc id="desc">A short wall of blocks for a toy animal and a toy beside two floor markers. Inviting one simple shared project while allowing the child to change direction is the month's focus.</desc>
  <rect width="1200" height="760" fill="#f7f4ed"/>
  <circle cx="110" cy="100" r="48" fill="#4d8a5f"/>
  <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">22</text>
  <text x="180" y="88" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#20342e">Make a small plan</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="19" fill="#50635c">WHO responsive care · AAP play guidance — selected examples, practical adaptation</text>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#c8d2cc" stroke-width="2"/>
  <rect x="40" y="170" width="640" height="430" rx="20" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4d8a5f">One simple shared project</text>
  <rect x="70" y="530" width="580" height="8" rx="4" fill="#e4ece8"/>
  <rect x="160" y="430" width="90" height="70" rx="12" fill="#9a6b3f"/>
  <rect x="265" y="395" width="80" height="70" rx="12" fill="#2b6f63"/>
  <rect x="360" y="360" width="80" height="70" rx="12" fill="#7a557d"/>
  <path d="M220 500 L340 500 L330 470 L230 470 Z" fill="#8fae97"/>
  <circle cx="285" cy="462" r="12" fill="#b85f4e"/>
  <text x="295" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">a wall for the toy animal</text>
  <circle cx="480" cy="452" r="30" fill="#3f7f9a"/>
  <rect x="455" y="478" width="50" height="8" rx="4" fill="#b85f4e"/>
  <rect x="540" y="452" width="34" height="34" rx="8" fill="none" stroke="#4d8a5f" stroke-width="4"/>
  <text x="508" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">carry between markers</text>
  <text x="360" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">Invite a simple shared project, then allow the child to change direction whenever they want.</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="170" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="216" r="30" fill="#dceadf"/>
    <rect x="749" y="201" width="30" height="30" rx="6" fill="#4d8a5f"/>
    <text x="816" y="214" font-size="21" font-weight="700" fill="#20342e">Build a short wall</text>
    <text x="816" y="240" font-size="16" fill="#50635c">Try a different arrangement together</text>
    <rect x="720" y="282" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="328" r="30" fill="#dceadf"/>
    <circle cx="764" cy="328" r="19" fill="#4d8a5f"/>
    <text x="816" y="326" font-size="21" font-weight="700" fill="#20342e">Carry toy between markers</text>
    <text x="816" y="352" font-size="16" fill="#50635c">Optional gentle kick on a clear surface</text>
    <rect x="720" y="394" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="440" r="30" fill="#dceadf"/>
    <rect x="752" y="424" width="24" height="32" rx="4" fill="#4d8a5f"/>
    <line x1="764" y1="424" x2="764" y2="456" stroke="#f7f4ed" stroke-width="2"/>
    <text x="816" y="438" font-size="21" font-weight="700" fill="#20342e">Talk about a scene</text>
    <text x="816" y="464" font-size="16" fill="#50635c">"What are the characters doing?"</text>
    <rect x="720" y="506" width="440" height="92" rx="16" fill="#ffffff" stroke="#c8d2cc" stroke-width="2"/>
    <circle cx="764" cy="552" r="30" fill="#dceadf"/>
    <path d="M764 565 C754 558 746 550 746 544 C746 537 753 533 760 533 C763 533 764 535 764 535 C764 535 765 533 768 533 C775 533 782 537 782 544 C782 550 774 558 764 565 Z" fill="#4d8a5f"/>
    <text x="816" y="550" font-size="21" font-weight="700" fill="#20342e">"We can try, or do another"</text>
    <text x="816" y="576" font-size="16" fill="#50635c">Help and rest are normal options</text>
  </g>
  <rect x="40" y="630" width="1120" height="92" rx="14" fill="#e4ece8"/>
  <text x="600" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">WHO responsive care and AAP play guidance support this broad approach. This month is a practical adaptation, not a checklist.</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#30473f">For monitoring, use the CDC 15, 18, and 24-month checkpoints; raise concerns whenever they arise.</text>
</svg>